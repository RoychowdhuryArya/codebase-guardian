name: Archwarden Architecture Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract unified diff
        run: git diff --binary "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > pr.diff

      - name: Start Archwarden
        working-directory: archwarden
        run: docker compose up -d backend

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8080/health && exit 0
            sleep 2
          done
          exit 1

      - name: Make pull request checkout available to backend
        run: docker cp "$GITHUB_WORKSPACE/." archwarden-backend:/workspace

      - name: Review pull request
        id: review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          payload = {
              "pr_id": os.environ["PR_NUMBER"],
              "repo_dir": "/workspace",
              "diff": pathlib.Path("pr.diff").read_text(),
              "k_hops": 2,
          }
          request = urllib.request.Request(
              "http://localhost:8080/review/run",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request) as response:
              pathlib.Path("review.json").write_bytes(response.read())
          result = json.loads(pathlib.Path("review.json").read_text())
          pathlib.Path("review.md").write_text(result.get("summary", "Review completed"))
          print(json.dumps(result))
          PY

      - name: Comment review and set status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            const violations = result.new_violations || [];
            const rows = violations.length
              ? violations.map(v => {
                  const location = v.file && v.line ? ` (\`${v.file}:${v.line}\`)` : '';
                  return `- **${v.principle_id || 'principle'}**${location} ${v.statement || ''} — Fix: ${v.fix_hint || 'see the principle guidance'}`;
                }).join('\n')
              : '✅ No new architecture violations detected.';
            const body = [
              '## Archwarden Architecture Review',
              '',
              `**Touched services:** ${(result.touched_services || []).join(', ') || 'none'}`,
              `**Blast radius:** ${(result.blast_radius || []).join(', ') || 'none'}`,
              '',
              '### Detected Violations',
              rows,
              '',
              `### Status: ${violations.some(v => String(v.severity).toLowerCase() === 'high') ? '❌ Fail' : '✅ Pass'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            if (violations.some(v => String(v.severity).toLowerCase() === 'high')) {
              core.setFailed('Archwarden detected high-severity architectural regressions.');
            }
