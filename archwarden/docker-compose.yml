services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archwarden-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=host.docker.internal
      - FALKORDB_PORT=6379
      - ARCHWARDEN_GRAPH=falkor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archwarden-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - PORT=3001
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
